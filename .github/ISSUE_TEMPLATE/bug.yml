name: Beta bug report
description: Report a reproducible Interlude beta problem without private task data.
title: "[Beta] "
body:
  - type: markdown
    attributes:
      value: "Never include pairing codes, prompts, private project paths, or account credentials. Review screenshots before attaching them."
  - type: input
    id: environment
    attributes:
      label: OS, browser version, and media service
    validations:
      required: true
  - type: textarea
    id: surface
    attributes:
      label: Assistant and interface
      description: Claude or Codex? Website, desktop Code, ordinary Chat, or Cowork? Include app version if visible and Interlude build/version.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include website/desktop monitoring mode, multiple tasks, assistant windows and monitors.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
      description: Did media and sound really pause? Did the correct assistant tab/window come forward or request taskbar attention?
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Debug summary
      description: Desktop users can use Connection details → Check setup → Copy debug summary. Website-only users can copy the website status text. Exclude private conversation content.
      render: json
