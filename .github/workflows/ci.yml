name: Verify Interlude
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run smoke:native
      - run: npm audit --audit-level=high
      - run: npm run package:release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.node == 24
        with:
          name: interlude-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 14

  browser:
    name: Chromium extension and dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Prepare generated demo media
        run: |
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          node scripts/demo-video.mjs prepare
      - name: Record verified beta flow
        run: npx playwright test tests/e2e/record-demo.spec.mjs
        env:
          INTERLUDE_RECORD_DEMO: '1'
      - run: node scripts/demo-video.mjs compose
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: interlude-beta-video
          path: |
            artifacts/demo/interlude-beta-demo.mp4
            artifacts/demo/*.jpg
            artifacts/demo/evidence.json
            artifacts/demo/video-info.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  desktop:
    name: Desktop / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-15-intel]
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run desktop:dist
      - name: Verify packaged Windows app
        if: runner.os == 'Windows'
        run: npm run desktop:smoke -- artifacts/desktop/win-unpacked/Interlude.exe
      - name: Verify packaged macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [ "$(uname -m)" = arm64 ]; then
            npm run desktop:smoke -- "artifacts/desktop/mac-arm64/Interlude.app/Contents/MacOS/Interlude"
          else
            npm run desktop:smoke -- "artifacts/desktop/mac/Interlude.app/Contents/MacOS/Interlude"
          fi
      - run: node scripts/desktop-checksums.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: interlude-desktop-${{ runner.os }}-${{ runner.arch }}
          path: |
            artifacts/desktop/Interlude-*.exe
            artifacts/desktop/Interlude-*.dmg
            artifacts/desktop/Interlude-*.zip
            artifacts/desktop/SHA256SUMS.txt
            artifacts/desktop-qa/*.png
          if-no-files-found: error
          retention-days: 14
